name: CI

on:
  pull_request:
  push:
    branches:
      - claude/julia-vizdoom-lab-yg2u0a

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Decision layer unit tests
        run: >
          pytest -q
          tests/test_actions.py
          tests/test_state.py
          tests/test_rule_based_agent.py
          tests/test_fallback.py
          tests/test_anti_loop.py
          tests/test_filter.py
          tests/test_logging.py
          tests/test_minecraft_shadow.py
          agent_decision_eval/tests
